name: Process due loan payments

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-due-loans:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke protected due-loan job
        env:
          LOAN_JOB_URL: ${{ secrets.LOAN_JOB_URL }}
          LOAN_JOB_SECRET: ${{ secrets.LOAN_JOB_SECRET }}
        run: |
          test -n "$LOAN_JOB_URL"
          test -n "$LOAN_JOB_SECRET"
          curl --fail --show-error --silent \
            --output /dev/null \
            --retry 2 \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $LOAN_JOB_SECRET" \
            "$LOAN_JOB_URL"
