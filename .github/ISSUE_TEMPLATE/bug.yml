name: Bug
description: Report incorrect existing behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: scope
    attributes:
      label: Finance Tracker scope
      description: Select the area most directly affected.
      options:
        - Frontend
        - Backend
        - Database
        - Cross-cutting or not sure

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should have happened instead.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or evidence
      description: Add screenshots, logs, or other evidence when relevant. Remove secrets and personal data first.

  - type: textarea
    id: environment
    attributes:
      label: Environment and context
      description: Note the browser, operating system, page, component, deployment, or other relevant context.
    validations:
      required: true

  - type: textarea
    id: possible-cause
    attributes:
      label: Possible cause
      description: Optionally share a suspected cause or useful implementation lead.

  - type: dropdown
    id: release-impact
    attributes:
      label: Initial release impact
      description: Intake may remain unknown. The implementing agent must resolve impact before the verification handoff.
      options:
        - Pending / not yet known
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true

  - type: textarea
    id: release-context
    attributes:
      label: Release context (optional)
      description: If known, explain the impact or link an existing grouped release candidate. No version decision is required at intake.

  - type: markdown
    attributes:
      value: |
        Before Verify, the implementing agent must report the complete [Release / Version gate](https://github.com/OzAvrahami/finance-tracker/blob/main/docs/github-development-standard.md#release--version-gate) on this Issue and in the final handoff. Resolve release and SemVer impact, record every gate status, and leave owner acceptance Pending until confirmed. Version preparation and publication may be explicitly deferred under that policy.
