name: Chore
description: Capture maintenance or technical work
title: "[Chore]: "
labels:
  - chore
body:
  - type: dropdown
    id: scope
    attributes:
      label: Finance Tracker scope
      description: Select the area most directly affected.
      options:
        - Frontend
        - Backend
        - Database
        - Cross-cutting or not sure

  - type: textarea
    id: task
    attributes:
      label: Maintenance or technical task
      description: Describe the maintenance, tooling, dependency, refactoring, or technical-debt work.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this work is needed now or what risk it addresses.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: State how completion can be verified, including regression coverage where relevant.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant technical context
      description: Add useful files, dependencies, affected layers, migration needs, or implementation notes.

