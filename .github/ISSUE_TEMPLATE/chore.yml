name: Chore
description: Capture maintenance or technical work
title: "[Chore]: "
labels:
  - chore
body:
  - type: dropdown
    id: scope
    attributes:
      label: Finance Tracker scope
      description: Select the area most directly affected.
      options:
        - Frontend
        - Backend
        - Database
        - Cross-cutting or not sure

  - type: textarea
    id: task
    attributes:
      label: Maintenance or technical task
      description: Describe the maintenance, tooling, dependency, refactoring, or technical-debt work.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this work is needed now or what risk it addresses.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: State how completion can be verified, including regression coverage where relevant.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant technical context
      description: Add useful files, dependencies, affected layers, migration needs, or implementation notes.

  - type: dropdown
    id: release-impact
    attributes:
      label: Initial release impact
      description: Intake may remain unknown. The implementing agent must resolve impact before the verification handoff.
      options:
        - Pending / not yet known
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true

  - type: textarea
    id: release-context
    attributes:
      label: Release context (optional)
      description: If known, explain the impact or link an existing grouped release candidate. No version decision is required at intake.

  - type: markdown
    attributes:
      value: |
        Before Verify, the implementing agent must report the complete [Release / Version gate](https://github.com/OzAvrahami/finance-tracker/blob/main/docs/github-development-standard.md#release--version-gate) on this Issue and in the final handoff. Resolve release and SemVer impact, record every gate status, and leave owner acceptance Pending until confirmed. Version preparation and publication may be explicitly deferred under that policy.
