name: Feature
description: Propose a new capability
title: "[Feature]: "
labels:
  - feature
body:
  - type: dropdown
    id: scope
    attributes:
      label: Finance Tracker scope
      description: Select the area most directly affected.
      options:
        - Frontend
        - Backend
        - Database
        - Cross-cutting or not sure

  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation
      description: Describe the user problem or opportunity this capability should address.
    validations:
      required: true

  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: Explain the new capability without prescribing unnecessary implementation detail.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe what should become possible or meaningfully easier.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance notes
      description: List the essential behavior, affected surfaces, or boundaries that would make the feature complete.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant examples, technical notes, references, constraints, or alternatives.

  - type: dropdown
    id: release-impact
    attributes:
      label: Initial release impact
      description: Intake may remain unknown. The implementing agent must resolve impact before the verification handoff.
      options:
        - Pending / not yet known
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true

  - type: textarea
    id: release-context
    attributes:
      label: Release context (optional)
      description: If known, explain the impact or link an existing grouped release candidate. No version decision is required at intake.

  - type: markdown
    attributes:
      value: |
        Before Verify, the implementing agent must report the complete [Release / Version gate](https://github.com/OzAvrahami/finance-tracker/blob/main/docs/github-development-standard.md#release--version-gate) on this Issue and in the final handoff. Resolve release and SemVer impact, record every gate status, and leave owner acceptance Pending until confirmed. Version preparation and publication may be explicitly deferred under that policy.
